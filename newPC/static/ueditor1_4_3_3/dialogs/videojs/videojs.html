<script type="text/javascript">
    const basePath = window.location.href.indexOf('www.zhxiaoyuan.cn') !== -1 ? 'https://www.zhxiaoyuan.cn/wxcepClient1/' : 'https://www.weixiaojia.net/wxcepClient1/';

    // 新版前端上传
    function WebUploader(config) {
        this.$progressContainer = config.$progressContainer && config.$progressContainer.length !== 0 ?
            config.$progressContainer :
            $('.install-file-content .process_wrap');
        config = $.extend({}, {
            successCallback: function(data) {
                console.log(data);
            },
            errorCallback: function(data) {
                console.log(data);
            },
            deleteCallback: function() {},
            extList: [],
            pathPrefix: 'fuwenben',
            initUrl: basePath + '/common/getWxCosFileSign'
        }, config);
        this.successCallback = config.successCallback;
        this.errorCallback = config.errorCallback;
        this.deleteCallback = config.deleteCallback;
        this.initUrl = config.initUrl;
        this.cos = null;
        this.bucket = '';
        this.extList = config.extList;
        this.files = [];
        this.region = 'ap-shanghai';
        this.pathPrefix = config.pathPrefix;
    }

    // 初始化
    WebUploader.prototype.init = function() {
        var _this = this;
        $.ajax({
            url: _this.initUrl,
            type: 'GET',
            dataType: 'json',
            data: {sysBucket: 1},
            success: function (data) {
                if(data.data) {
                    var pageData = JSON.parse(data.data);
                    // console.log(pageData);
                    _this.bucket = pageData.bucketName;
                    _this.cos = new COS({
                        // 必选参数
                        getAuthorization: function (options, callback) {
                            callback({
                                TmpSecretId: pageData.credentials.tmpSecretId,
                                TmpSecretKey: pageData.credentials.tmpSecretKey,
                                XCosSecurityToken: pageData.credentials.sessionToken,
                                ExpiredTime: pageData.expiredTime
                            });
                        }
                    });
                } else {
                    showError(data.msg);
                }

            }
        });
    };

    // 前端上传文件
    WebUploader.prototype.uploadFile = function (file) {
        var fileExt = file.name.replace(/.+\./, "").toLowerCase();   //正则表达式获取后缀
        var year = new Date().getFullYear();
        var timestamp = new Date().valueOf();
        var _this = this;

        const url = URL.createObjectURL(file);  
        const video = document.createElement('video');
        video.src = url;       
        video.onloadedmetadata = () => { 
           const bitrate=  (file.size * 8)/(video.duration*1024)            
            //处理完码率后，可以清理 URL 对象和释放 video 元素资源          
            URL.revokeObjectURL(url);
            video.remove(); // 如果需要的话，可以移除 video 元素
            // alert(bitrate)
        //   if(bitrate>1000){
        //         showError('请上传小于2Mb的文件');
        //         return;
        //   }
             var Key = _this.pathPrefix + '/' + year + '/' + timestamp + '/' + file.name;
        if (_this.extList.length !==0 &&_this.extList.indexOf(fileExt) === -1) {
            showError('请上传后缀名为[' + _this.extList.join(', ') + ']的文件');
        } else if(_this.size > 2 * 1024 * 1024) {
            showError('请上传小于2Mb的文件');
        } else {
            if(file.size > 50 * 1024 * 1024) {
                                showError('超过50M的视频，请使用视频链接');
                                return;
                            }else{
                                showError('');
                            }
            _this.cos.putObject({
                Bucket: _this.bucket,
                Region: _this.region,
                Key: Key,
                Body: file,
                onTaskReady(taskId) {},
                onProgress(progressData) {
                    if(_this.$progressContainer) {
                        _this.$progressContainer.text(progressData.percent * 100 + '%');
                    }
                }
            }, function(err, data) {
               
                if(err) {
                    _this.$message.error(err.error)
                } else {
                    _this.cos.putObjectTagging({
                        Bucket: this.bucket, /* 必须 */
                        Region: this.region,     /* 存储桶所在地域，必须字段 */
                        Key: Key, /* 存储在桶里的对象键（例如1.jpg，a/b/test.txt），必须字段 */
                        Tags: [
                            {"Key": "year", "Value": year},
                            {"Key": "school", "Value": window.sessionStorage.getItem('schoolId')},
                            {"Key": "module", "Value": 'fuwenben'},
                            {"Key": "modulecode", "Value": '00000'}
                        ],
                        // VersionId: 'MTg0NDUwOTMyODM1MDg2MTA1xxx' /* 对象版本 ID，非必须 */
                    }, (err, _1) => {
                        var fileUrl = 'https://' + data.Location;
                        if(/\.(jpe?g|png|bmp|gif)$/.test(fileUrl)) {
                            fileUrl = fileUrl.replace(/\.cos\.ap-.+?\./, '\.picsh\.');
                        }
                        $('#uploadFile').val('');
                        var fileObj = {
                            fileUrl: fileUrl,
                            fileName: file.name,
                            id: ''
                        };
                        _this.successCallback(fileObj)
                        const prefixPath = window.location.href.indexOf('www.zhxiaoyuan.cn') !== -1 ? 'https://www.zhxiaoyuan.cn/wxcepClient1/' : 'https://api.weixiaojia.net/wxcepClient1/';
                       
                        $.ajax({
                            headers: {
                                'content-type': 'application/json'
                            },
                            url: prefixPath + 'common/wxfileInfo/addWxfileInfo',
                            type: 'POST',
                            dataType: 'json',

                            data: JSON.stringify({
                                fileId: '',
                                fileSize: file.size,
                                fileUrl,
                                moduleCode: '00000',
                                moduleName: 'fuwenben',
                                schoolId: window.sessionStorage.getItem('schoolId')
                            }),
                            success: function () {
                            }
                        });
                    });
                }
            });
        }
        };
      
       
        return false;
    };

    WebUploader.prototype.deleteFile = function(path, callback) {
        //console.log("s",path);
        var _this = this;
        path = path.replace(/\.picsh\./, '.cos.ap-shanghai.');
        var Key = path.slice(path.indexOf('myqcloud.com') + 13);
        this.cos.deleteObject({
            Bucket: this.bucket,
            Region: this.region,
            Key: window.decodeURI(Key),
        }, function(err, data) {
            if(err) {
                showError(err)
            } else {
                //_this.deleteCallback();
                if(callback) {
                    callback();
                }
            }
        });
    };
    function closeimg(path,qq) {
        var $this=$(qq);
        function callbackB(){
            var $fileItem=$this.closest("li");
            $fileItem.remove();
        }
        uploader.deleteFile(path,callbackB);
    }

    function showError(error) {
        $('.upload-error').html(error);
    }

    function handleDialogOk() {
        var html='';
        $('.file-preview').each(function(index,item){
            var url = $(item).attr('data-src');
            html += '<video class="edui-upload-video vjs-default-skin video-js" controls="" preload="none" width="420" height="280" src="' + url + '">';
            html += '<source src="' + url + '" type="video/mp4"/>';
            html += '</video>';

        });
        console.log(html);
        editor.execCommand('insertHtml',html);
        dialog.close();
    }
    dialog.onok = handleDialogOk;

    var uploader = new WebUploader({
        $progressContainer: '',
        successCallback: function(data) {
            var accepUrl = data.fileUrl;
            var html = '';
            //图片
            html += '<li class="upload-image-item upload-image-item--bg-container">';
            html +=	' <i title="删除" onclick=closeimg("'+accepUrl+'",this)  class="upload-image-item__delete-btn"></i>' ;
            html +=    '<span data-src="'+accepUrl+'" class="file-preview"></span>' ;
            html +=	'</li>' ;
            $(".image-container").prepend(html);
            $("#uploadFile").attr("title", " ");
        },
        extList: ['mp4'],
        pathPrefix: 'fuwenben'
    });
    uploader.init();
    $('#uploadFile').off('change').on('change', function(e) {
        var files = e.target.files;
        for(let i = 0; i < files.length; i++) {
            uploader.uploadFile(files[i]);
        }
    });
</script>
</body>
</html>
